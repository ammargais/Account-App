name: Android checks and release
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks
          path: |
            app/build/reports/
            app/build/screenshots/
            app/build/pdf-preview/
            app/build/xlsx-preview/
      - uses: actions/upload-artifact@v4
        with:
          name: Daftar-debug-apk-for-development
          path: app/build/outputs/apk/debug/app-debug.apk
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native PDF and Android Keystore tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-checks
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, device]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'build-tools;35.0.0'
      - name: Retrieve and verify owner-signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          blob=$(jq -r .blob_sha distribution/release.json)
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq .content | base64 --decode > Daftar_0.3.0.apk
          python3 scripts/verify_distribution.py Daftar_0.3.0.apk
          sha256sum Daftar_0.3.0.apk > SHA256SUMS.txt
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(jq -r .tag distribution/release.json)
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$tag" --pattern Daftar_0.3.0.apk --dir existing
            cmp Daftar_0.3.0.apk existing/Daftar_0.3.0.apk
            echo "Identical release is already published."
          else
            gh release create "$tag" Daftar_0.3.0.apk SHA256SUMS.txt --target "$GITHUB_SHA" --title 'دفتر 0.3.0 — إصدار تجريبي' --notes-file docs/RELEASE_0.3.md --prerelease
          fi
